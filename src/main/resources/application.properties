spring.application.name=agro-notify
server.port=${PORT:8081}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/agro_notify}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET}
app.jwt.expiracao=${JWT_EXPIRATION:PT2H}

# Senha inicial dos administradores criados pelo AdminSeeder.
# Sem ela, nenhum administrador novo é criado e os existentes não são alterados.
app.admin.senha-inicial=${ADMIN_INITIAL_PASSWORD:}
